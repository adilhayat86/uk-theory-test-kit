name: Update dependency lockfile (temporary)

on:
  push:
    branches: [feature/competitive-learning-v1]

permissions:
  contents: write

jobs:
  lockfile:
    if: github.repository == 'adilhayat86/uk-theory-test-kit'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
      - name: Configure Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.1
      - name: Resolve react-native-svg compatible dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit updated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build: lock Expo-compatible SVG dependency"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
