name: App CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: TypeScript and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Type-check
        run: npm run typecheck
      - name: Run unit tests
        run: npm test -- --coverage

  expo-export:
    name: Android and iOS bundle export
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Export Android and iOS bundles
        run: npx expo export --platform all
      - name: Upload export artifact
        uses: actions/upload-artifact@v4
        with:
          name: expo-export
          path: dist/
          if-no-files-found: error

  android-build:
    name: Android debug APK build
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install
      - name: Generate Android native project
        run: npx expo prebuild --platform android --non-interactive
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios-simulator:
    name: iOS simulator build validation
    runs-on: macos-15
    needs: validate
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Install CocoaPods dependencies
        run: npx expo prebuild --platform ios --non-interactive
      - name: Build for iOS simulator
        run: |
          xcodebuild \
            -workspace ios/UKTheoryTestKit.xcworkspace \
            -scheme UKTheoryTestKit \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO
