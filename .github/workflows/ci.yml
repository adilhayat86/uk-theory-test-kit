name: Android MVP CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
  workflow_dispatch:
    inputs:
      artwork_review:
        description: Export the separate internal draft-artwork reviewer
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-mvp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Android MVP checks and tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.1
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check Expo dependency compatibility
        run: npm run doctor
      - name: Check Android-only MVP configuration
        run: node scripts/check-android-release.cjs
      - name: Type-check
        run: npm run typecheck
      - name: Run domain and configuration tests
        run: npm test -- --coverage
      - name: Test native APK verification guards
        run: python3 -m unittest discover -s scripts -p 'test_android_apk_verifier.py'
      - name: Enforce structural content requirements
        run: npm run check:mvp:content
      - name: Report independent editorial status (not paid-release approval)
        run: npm run check:mvp:editorial -- --report-only

  android-export:
    name: Export offline Android learner bundle
    runs-on: ubuntu-24.04
    needs: quality
    env:
      EXPO_PUBLIC_IMAGE_REVIEW: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.1
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Export Android learner bundle
        run: npm run export:android
      - name: Verify selected images and original offline videos
        run: node scripts/check-export-assets.cjs dist/android android learner
      - name: Upload Android learner bundle
        uses: actions/upload-artifact@v4
        with:
          name: android-learner-js-bundle
          path: dist/android/
          if-no-files-found: error
          retention-days: 7

  android-release:
    name: Build and verify offline Android learner APK
    runs-on: ubuntu-24.04
    needs: quality
    env:
      EXPO_PUBLIC_IMAGE_REVIEW: 'false'
      ANDROID_BUILD_CHANNEL: internal
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.1
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android API 37 platform
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            echo "Android SDK Manager is unavailable."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 "platforms;android-37.0" "build-tools;37.0.0"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate Android native project
        run: npx expo prebuild --platform android --no-install
      - name: Build standalone learner APK and CI-only App Bundle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon
      - name: Install isolated APK verification tools
        run: |
          python3 -m venv "$RUNNER_TEMP/android-apk-verifier"
          "$RUNNER_TEMP/android-apk-verifier/bin/python" -m pip install --disable-pip-version-check --no-input -r scripts/android-verify-requirements.txt
      - name: Verify native APK identity, permissions, backup, artwork and 16 KB support
        id: verify_apk
        run: |
          "$RUNNER_TEMP/android-apk-verifier/bin/python" scripts/verify_android_apk.py \
            android/app/build/outputs/apk/release/app-release.apk \
            --mode learner --signing test \
            --output dist/native/android-verification.json
      - name: Collect unverified APK and decoded diagnostics after verification failure
        if: ${{ failure() && steps.verify_apk.outcome == 'failure' }}
        run: |
          mkdir -p dist/native-failure
          DIAGNOSTIC_APK="android/app/build/outputs/apk/release/app-release.apk"
          DIAGNOSTIC_AAPT="$ANDROID_HOME/build-tools/37.0.0/aapt2"
          "$DIAGNOSTIC_AAPT" dump badging "$DIAGNOSTIC_APK" > dist/native-failure/badging.txt 2>&1 || true
          "$DIAGNOSTIC_AAPT" dump xmltree --file AndroidManifest.xml "$DIAGNOSTIC_APK" > dist/native-failure/manifest.txt 2>&1 || true
          "$DIAGNOSTIC_AAPT" dump resources "$DIAGNOSTIC_APK" > dist/native-failure/resources.txt 2>&1 || true
          "$DIAGNOSTIC_AAPT" dump permissions "$DIAGNOSTIC_APK" > dist/native-failure/permissions.txt 2>&1 || true
          sha256sum "$DIAGNOSTIC_APK" > dist/native-failure/apk-sha256.txt || true
          cp "$DIAGNOSTIC_APK" dist/native-failure/UNVERIFIED-app-release.apk
          cat > dist/native-failure/README.txt <<'TXT'
          This APK failed automated verification and is retained for diagnosis only.
          It is not an approved learner artifact or a production Play upload.
          Inspect the decoded outputs and run the complete corrected verifier before use.
          TXT
      - name: Upload failure-only APK verification diagnostics (UNVERIFIED)
        if: ${{ failure() && steps.verify_apk.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-verification-failure-diagnostics
          path: dist/native-failure/
          if-no-files-found: warn
          retention-days: 7
      # Expo's development certificate is intentionally retained for Samsung QA.
      # Publication requires owner credentials and the separate production gate.
      - name: Upload verified standalone Android learner APK
        uses: actions/upload-artifact@v4
        with:
          name: android-offline-test-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload native verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: android-native-verification
          path: dist/native/android-verification.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload CI-only App Bundle (NOT for Play publishing)
        uses: actions/upload-artifact@v4
        with:
          name: android-release-ci-only-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

  artwork-review:
    name: Optional internal artwork review export
    if: github.event_name == 'workflow_dispatch' && inputs.artwork_review == true
    runs-on: ubuntu-24.04
    needs: quality
    env:
      EXPO_PUBLIC_IMAGE_REVIEW: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.1
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Export separate internal artwork reviewer
        run: npx expo export --platform android --output-dir dist/android-artwork-review --clear
      - name: Verify complete internal artwork collection
        run: node scripts/check-export-assets.cjs dist/android-artwork-review android review
      - name: Upload internal review export
        uses: actions/upload-artifact@v4
        with:
          name: android-artwork-review-bundle
          path: dist/android-artwork-review/
          if-no-files-found: error
          retention-days: 7
