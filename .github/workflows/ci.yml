name: Mobile CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: TypeScript, tests and Expo diagnostics
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.1
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check Expo dependency compatibility
        run: npm run doctor
      - name: Type-check
        run: npm run typecheck
      - name: Run domain tests
        run: npm test -- --coverage
      - name: Report Android MVP content readiness (not a release approval)
        run: npm run check:mvp:content -- --report-only
      - name: Report human editorial sign-off status (not release approval)
        run: npm run check:mvp:editorial -- --report-only

  javascript-bundles:
    name: Export Android and iOS JavaScript bundles
    runs-on: ubuntu-24.04
    needs: quality
    env:
      EXPO_PUBLIC_IMAGE_REVIEW: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.1
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Export Android bundle
        run: npm run export:android
      - name: Export iOS bundle
        run: npm run export:ios
      - name: Verify learner exports exclude draft artwork
        run: |
          node scripts/check-export-assets.cjs dist/android android learner
          node scripts/check-export-assets.cjs dist/ios ios learner
      - name: Export internal offline artwork review bundle
        env:
          EXPO_PUBLIC_IMAGE_REVIEW: 'true'
        run: npx expo export --platform android --output-dir dist/android-artwork-review --clear
      - name: Verify all draft artwork is available offline for review
        run: node scripts/check-export-assets.cjs dist/android-artwork-review android review
      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: mobile-js-bundles
          path: dist/
          if-no-files-found: error
          retention-days: 7

  android-debug:
    name: Build Android device-test APK and bundles
    runs-on: ubuntu-24.04
    needs: quality
    env:
      # Internal QA APK exposes the pending-artwork browser; never a Play build.
      EXPO_PUBLIC_IMAGE_REVIEW: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.1
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android API 37 platform
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            echo "Android SDK Manager unavailable at $SDKMANAGER"
            ls -la "${ANDROID_HOME}/cmdline-tools" || true
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 "platforms;android-37.0" "build-tools;37.0.0"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate Android native project
        run: npx expo prebuild --platform android --non-interactive
      - name: Build debug APK and release-mode Android App Bundle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease bundleRelease --no-daemon
      - name: Verify standalone APK contains the offline JavaScript bundle
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile("android/app/build/outputs/apk/release/app-release.apk") as apk:
              bundle = apk.getinfo("assets/index.android.bundle")
              assert bundle.file_size > 0, "Offline JavaScript bundle is empty"
          PY
      # Expo's generated release signing uses the development key here.
      # This APK is for physical-device QA only, never Play publishing.
      - name: Upload standalone device-test APK
        uses: actions/upload-artifact@v4
        with:
          name: android-offline-test-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload debug APK (requires Metro, not for offline QA)
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      # The generated bundle is CI verification ONLY. A production Play release
      # must use the owner's upload key/Play App Signing, not a build-machine key.
      - name: Upload CI-only release App Bundle (NOT for Play publishing)
        uses: actions/upload-artifact@v4
        with:
          name: android-release-ci-only-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

  ios-simulator:
    name: Build iOS simulator app
    runs-on: macos-26
    needs: quality
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.1
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate iOS native project and install Pods
        run: npx expo prebuild --platform ios --non-interactive
      - name: Build for iOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          if [[ -z "$WORKSPACE" ]]; then
            echo "Expo did not generate an Xcode workspace."
            exit 1
          fi
          SCHEME="$(basename "$WORKSPACE" .xcworkspace)"
          echo "Building workspace: $WORKSPACE"
          xcodebuild -list -workspace "$WORKSPACE"
          echo "Using scheme: $SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: build/ios/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: error
          retention-days: 7
