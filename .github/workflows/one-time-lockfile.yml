name: Generate npm lockfile (one-time maintenance)

on:
  push:
    branches: [audit/2026-11-06-hardening]

permissions:
  contents: write

jobs:
  generate-lockfile:
    if: github.repository == 'adilhayat86/uk-theory-test-kit'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v7
      - name: Install supported Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.1
      - name: Generate deterministic npm dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit only the generated package-lock file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: commit reproducible npm dependency lockfile"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
